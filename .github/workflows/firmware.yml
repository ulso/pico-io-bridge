name: Firmware

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Adafruit RP2040 CAN
            feature: board-adafruit-rp2040-can
            artifact: pico-io-bridge-adafruit-rp2040-can
          - label: Adafruit Feather RP2040
            feature: board-adafruit-feather-rp2040
            artifact: pico-io-bridge-adafruit-feather-rp2040
          - label: Adafruit Feather RP2040 USB Host
            feature: board-adafruit-rp2040-usb-host
            artifact: pico-io-bridge-adafruit-rp2040-usb-host
          - label: Adafruit KB2040
            feature: board-adafruit-kb2040
            artifact: pico-io-bridge-adafruit-kb2040

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.96.0 --profile minimal --target thumbv6m-none-eabi
          rustup default 1.96.0

      - name: Install UF2 converter
        run: cargo install elf2uf2-rs --version 2.2.0 --locked --no-default-features

      - name: Build firmware
        run: >-
          cargo build --locked --release --no-default-features
          --features ${{ matrix.feature }}

      - name: Create UF2 image
        run: |
          mkdir -p dist
          elf2uf2-rs \
            target/thumbv6m-none-eabi/release/pico-io-bridge \
            dist/${{ matrix.artifact }}.uf2

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.feature }}
          path: dist/${{ matrix.artifact }}.uf2
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use the form vX.Y.Z (for example v0.1.0)." >&2
            exit 1
          fi

      - name: Download all firmware images
        uses: actions/download-artifact@v8
        with:
          pattern: firmware-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.uf2 > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.uf2 dist/SHA256SUMS
          --verify-tag
          --generate-notes
